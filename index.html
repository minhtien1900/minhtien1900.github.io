f=await file.arrayBuffer(),tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).put({name:file.name,size:file.size,data:buf},key);}catch(err){console.error(err);}}async function loadFileFromIndexedDB(key){try{const db=await openDB();return new Promise((res,rej)=>{const req=db.transaction(STORE_NAME,"readonly").objectStore(STORE_NAME).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}catch(err){return null;}}function getBookHistory(){try{return JSON.parse(localStorage.getItem('reader_book_history')||'[]');}catch(e){return [];}}function addBookToHistory(name,size){const key=`book_${name}_${size}`;let history=getBookHistory();history=history.filter(b=>b.key!==key);history.unshift({key,name,size});localStorage.setItem('reader_book_history',JSON.stringify(history));return key;}function revokeActiveBlobUrls(){if(activeBlobUrls.length>0){activeBlobUrls.forEach(url=>URL.revokeObjectURL(url));activeBlobUrls=[];}}autoSpeakToggleBtn.addEventListener('click',()=>{isAutoSpeakOn=!isAutoSpeakOn;localStorage.setItem('reader_auto_speak',isAutoSpeakOn);updateAutoSpeakButtonUI();});function updateAutoSpeakButtonUI(){if(isAutoSpeakOn){autoSpeakToggleBtn.innerHTML='🔊 Auto Speak: On';autoSpeakToggleBtn.classList.add('active');}else{autoSpeakToggleBtn.innerHTML='🔇 Auto Speak: Off';autoSpeakToggleBtn.classList.remove('active');}}fontFamilySelect.addEventListener('change',e=>{currentFontFamily=e.target.value;localStorage.setItem('reader_font_family',currentFontFamily);applyFontSettings();});fontIncreaseBtn.addEventListener('click',()=>{if(currentFontSize<32){currentFontSize+=2;localStorage.setItem('reader_font_size',currentFontSize);applyFontSettings();}});fontDecreaseBtn.addEventListener('click',()=>{if(currentFontSize>12){currentFontSize-=2;localStorage.setItem('reader_font_size',currentFontSize);applyFontSettings();}});function applyFontSettings(){document.documentElement.style.setProperty('--reader-font-size',currentFontSize+'px');document.documentElement.style.setProperty('--reader-font-family',currentFontFamily);}themeToggle.addEventListener('click',()=>{const html=document.documentElement;if(html.getAttribute('data-theme')==='light'){html.setAttribute('data-theme','dark');themeToggle.innerHTML='☀️ Light';localStorage.setItem('reader_theme','dark');}else{html.setAttribute('data-theme','light');themeToggle.innerHTML='🌙 Theme';localStorage.setItem('reader_theme','light');}});panelCloseBtn.addEventListener('click',()=>{meaningPanel.classList.remove('active');});savePosBtn.addEventListener('click',()=>{if(bookContent.style.display==='none'){alert('No book opened yet!');return;}if(activeBookKey){localStorage.setItem(`pos_${activeBookKey}`,readerContainer.scrollTop);savePosBtn.innerHTML='✅ Saved';setTimeout(()=>{savePosBtn.innerHTML='💾 Save';},1500);}});readerContainer.addEventListener('scroll',()=>{if(bookContent.style.display!=='none'&&activeBookKey){clearTimeout(window.scrollTimeout);window.scrollTimeout=setTimeout(()=>{localStorage.setItem(`pos_${activeBookKey}`,readerContainer.scrollTop);},400);}});statsBtn.addEventListener('click',()=>{renderStatsModal();statsModal.classList.add('active');});closeStatsModal.addEventListener('click',()=>{statsModal.classList.remove('active');});clearStatsBtn.addEventListener('click',()=>{if(confirm('Clear all learned vocabulary history?')){localStorage.removeItem('reader_vocab_history');renderStatsModal();}});function recordVocab(word,def){try{let history=JSON.parse(localStorage.getItem('reader_vocab_history')||'[]');let ipa="N/A",meaning=def;const match=def.match(/^(\/[^\/]+\/|\[[^\]]+\])/);if(match){ipa=match[1];meaning=def.replace(match[1],'').trim();}history=history.filter(item=>item.word.toLowerCase()!==word.toLowerCase());history.unshift({word,ipa,meaning,time:new Date().toLocaleDateString()});localStorage.setItem('reader_vocab_history',JSON.stringify(history));}catch(e){}}function renderStatsModal(){let history=[];try{history=JSON.parse(localStorage.getItem('reader_vocab_history')||'[]');}catch(e){}if(history.length===0){statsModalBody.innerHTML='<div style="text-align:center; color: #8e8e93; padding: 20px;">No words clicked yet.</div>';return;}let html='';history.forEach(item=>{html+=`<div class="vocab-item"><div class="vocab-word">${item.word}</div><div class="vocab-ipa">IPA: ${item.ipa}</div><div class="vocab-meaning">${item.meaning}</div></div>`;});statsModalBody.innerHTML=html;}listBooksBtn.addEventListener('click',()=>{renderBooksModal();booksModal.classList.add('active');});closeBooksModal.addEventListener('click',()=>{booksModal.classList.remove('active');});function renderBooksModal(){const history=getBookHistory();booksModalBody.innerHTML='';if(history.length===0){booksModalBody.innerHTML='<div style="text-align:center; color: #8e8e93; padding: 20px;">No book history found.</div>';return;}history.forEach(b=>{const itemEl=document.createElement('div');itemEl.className='book-item';itemEl.innerHTML=`<div class="book-item-name">📖 ${b.name}</div><div class="book-item-action">Open →</div>`;itemEl.addEventListener('click',async()=>{booksModal.classList.remove('active');const savedData=await loadFileFromIndexedDB(b.key);if(savedData&&savedData.data){processEpubData(savedData.data,b.name,b.size,b.key);}else{alert('Book file data not found in storage!');}});booksModalBody.appendChild(itemEl);});}function updateProgress(p,t){progressContainer.style.display='block';progressFill.style.width=p+'%';bookContent.innerHTML=`<div style="text-align:center; padding: 50px 20px;"><div style="font-style:italic; margin-bottom: 12px; font-size: 16px;">⏳ ${t}</div><div style="font-weight:600; color: var(--accent-color); font-size: 18px;">${p}%</div></div>`;}async function processEpubData(buf,name,size,customKey=null){revokeActiveBlobUrls();activeBookKey=customKey||addBookToHistory(name,size);welcomeScreen.style.display='none';bookContent.style.display='block';try{updateProgress(10,"Unzipping EPUB file...");const zip=new JSZip(),zipContent=await zip.loadAsync(buf);updateProgress(25,"Processing book images...");const imageMap={};const imageFiles=zipContent.file(/\.(jpg|jpeg|png|gif|svg|webp)$/i);for(let imgFile of imageFiles){const blob=await imgFile.async("blob");const blobUrl=URL.createObjectURL(blob);activeBlobUrls.push(blobUrl);const fullPath=imgFile.name.toLowerCase();const fileName=fullPath.split('/').pop();imageMap[fullPath]=blobUrl;imageMap[fileName]=blobUrl;}updateProgress(40,"Reading book structure...");const containerFile=zipContent.file("META-INF/container.xml");if(!containerFile)throw new Error("Missing container.xml");const containerDoc=new DOMParser().parseFromString(await containerFile.async("text"),"text/xml");const rootfileNode=containerDoc.querySelector("rootfile");if(!rootfileNode)throw new Error("Missing rootfile");const opfPath=rootfileNode.getAttribute("full-path"),opfFolder=opfPath.includes("/")?opfPath.substring(0,opfPath.lastIndexOf("/")+1):"";const opfFile=zipContent.file(opfPath);if(!opfFile)throw new Error("Missing OPF");const opfDoc=new DOMParser().parseFromString(await opfFile.async("text"),"text/xml");updateProgress(55,"Loading CSS definitions...");let combinedCSS="";opfDoc.querySelectorAll("item[media-type='text/css']").forEach(item=>{const cssFile=zipContent.file(opfFolder+item.getAttribute("href"));if(cssFile)cssFile.async("text").then(t=>combinedCSS+=t+"\n");});epubCustomStyles.textContent=combinedCSS;const itemrefs=opfDoc.querySelectorAll("spine itemref"),manifestItems={};opfDoc.querySelectorAll("manifest item").forEach(item=>{manifestItems[item.getAttribute("id")]=item.getAttribute("href");});updateProgress(75,"Merging chapter contents...");let htmlFragments=[];for(let itemref of itemrefs){const href=manifestItems[itemref.getAttribute("idref")];if(href){const htmlFile=zipContent.file(opfFolder+href);if(htmlFile){const htmlText=await htmlFile.async("text");const bodyContent=new DOMParser().parseFromString(htmlText,"text/html").body?.innerHTML||htmlText;htmlFragments.push(`<div class="epub-chapter" style="margin-bottom: 40px; word-break: break-word; overflow-wrap: break-word;">${bodyContent}</div>`);}}}if(htmlFragments.length===0){progressContainer.style.display='none';bookContent.innerHTML='<div style="text-align:center; padding: 40px;">Content not found.</div>';return;}updateProgress(90,"Formatting layout & resolving images...");setTimeout(()=>{const tempDiv=document.createElement('div');tempDiv.innerHTML=htmlFragments.join('');tempDiv.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src');if(!src)return;const cleanSrc=src.split('?')[0].split('#')[0].toLowerCase();const fileName=cleanSrc.split('/').pop();if(imageMap[cleanSrc]||imageMap[fileName]){img.src=imageMap[cleanSrc]||imageMap[fileName];}});tempDiv.querySelectorAll('image').forEach(img=>{const href=img.getAttribute('href')||img.getAttribute('xlink:href');if(!href)return;const cleanHref=href.split('?')[0].split('#')[0].toLowerCase();const fileName=cleanHref.split('/').pop();if(imageMap[cleanHref]||imageMap[fileName]){const targetUrl=imageMap[cleanHref]||imageMap[fileName];img.setAttribute('href',targetUrl);img.setAttribute('xlink:href',targetUrl);}});bookContent.innerHTML=tempDiv.innerHTML;formatBilingualLayout();prepareWordTokens();attachTitleEvents();brandTitleText.textContent=`📁 Filename: ${name}`;progressContainer.style.display='none';const savedScrollPos=localStorage.getItem(`pos_${activeBookKey}`);if(savedScrollPos){setTimeout(()=>{readerContainer.scrollTo({top:parseInt(savedScrollPos),behavior:'smooth'});},100);}else{readerContainer.scrollTop=0;}},50);}catch(err){progressContainer.style.display='none';welcomeScreen.style.display='flex';bookContent.style.display='none';alert(`Error: ${err.message}`);}}fileInput.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const key=addBookToHistory(file.name,file.size);await saveFileToIndexedDB(file,key);processEpubData(await file.arrayBuffer(),file.name,file.size,key);});window.addEventListener('DOMContentLoaded',async()=>{try{const history=getBookHistory();if(history.length>0){const lastBook=history[0];const savedData=await loadFileFromIndexedDB(lastBook.key);if(savedData&&savedData.data){processEpubData(savedData.data,lastBook.name,lastBook.size,lastBook.key);}}}catch(err){}});function formatBilingualLayout(){bookContent.querySelectorAll('p, div, figcaption, h1, h2, h3, h4').forEach(p=>{const text=p.textContent.trim();if(p.querySelector('i, em')||text.match(/[àáạảãâấầẩẫậăắằẳẵặèéẹẻẽêếềểễệìíịỉĩòóọỏõôốồổỗộơớờởỡợùúụủũưứừửữựỳýỵỷỹđ]/i)){if(!p.querySelector('span[title]'))p.classList.add('sentence-vi');}});}function prepareWordTokens(){const selectors='p, div, figcaption, h1, h2, h3, h4, h5, h6, li';bookContent.querySelectorAll(selectors).forEach(node=>{if(node.children.length>0&&Array.from(node.children).some(child=>['P','DIV','H1','H2','H3','H4','LI'].includes(child.tagName)))return;const isViNode=node.classList.contains('sentence-vi')||node.closest('.sentence-vi')||node.tagName==='I'||node.tagName==='EM';function wrapTextNodes(el){Array.from(el.childNodes).forEach(child=>{if(child.nodeType===Node.TEXT_NODE){const val=child.nodeValue;if(!val.trim())return;const fragment=document.createDocumentFragment();const tokens=val.split(/(\s+|[.,!?;:()""''\[\]{}]+)/);tokens.forEach(token=>{if(!token)return;if(/\S/.test(token)&&!/^[.,!?;:()""''\[\]{}]+$/.test(token)){const span=document.createElement('span');span.className=isViNode?'vi-word-token':'en-word-token';span.textContent=token;fragment.appendChild(span);}else{fragment.appendChild(document.createTextNode(token));}});child.parentNode.replaceChild(fragment,child);}else if(child.nodeType===Node.ELEMENT_NODE&&!child.hasAttribute('title')&&!['SCRIPT','STYLE'].includes(child.tagName)){wrapTextNodes(child);}});}wrapTextNodes(node);});}function attachTitleEvents(){bookContent.querySelectorAll('span[title], [title]').forEach(el=>{const wordText=el.textContent.trim(),titleValue=el.getAttribute('title');if(!wordText||!titleValue)return;el.addEventListener('click',e=>{e.stopPropagation();currentActiveWord=wordText;panelWordText.textContent=wordText;panelDefText.textContent=titleValue;meaningPanel.classList.add('active');recordVocab(wordText,titleValue);if(isAutoSpeakOn)speakWord(wordText);});});}panelSpeakBtn.addEventListener('click',()=>{if(currentActiveWord)speakWord(currentActiveWord);});function cleanTextForSpeech(text){return text.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();}function speakWord(word){if('speechSynthesis'in window){window.speechSynthesis.cancel();const cleanWord=cleanTextForSpeech(word);if(!cleanWord)return;const u=new SpeechSynthesisUtterance(cleanWord);u.lang='en-US';const v=getBestVoice('en');if(v)u.voice=v;u.rate=currentSpeechRate;window.speechSynthesis.speak(u);}}function clearSearchHighlights(){document.querySelectorAll('.search-highlight').forEach(el=>{const parent=el.parentNode;if(parent){parent.replaceChild(document.createTextNode(el.textContent),el);parent.normalize();}});searchResults=[];currentSearchIndex=-1;searchCount.textContent='0/0';}function performSearch(keyword){clearSearchHighlights();if(!keyword||keyword.trim().length<2)return;const cleanKeyword=keyword.trim().toLowerCase();const walk=document.createTreeWalker(bookContent,NodeFilter.SHOW_TEXT,null,false);const matches=[];let node;while(node=walk.nextNode()){if(node.parentNode.classList.contains('search-highlight'))continue;const val=node.nodeValue;const valLower=val.toLowerCase();let pos=0;while((pos=valLower.indexOf(cleanKeyword,pos))!==-1){matches.push({node,pos,length:cleanKeyword.length});pos+=cleanKeyword.length;}}for(let i=matches.length-1;i>=0;i--){const m=matches[i];try{const range=document.createRange();range.setStart(m.node,m.pos);range.setEnd(m.node,m.pos+m.length);const span=document.createElement('span');span.className='search-highlight';range.surroundContents(span);searchResults.unshift(span);}catch(e){}}if(searchResults.length>0){currentSearchIndex=0;updateSearchResultFocus();}else{searchCount.textContent='0/0';}}function updateSearchResultFocus(){searchResults.forEach((el,idx)=>{if(idx===currentSearchIndex){el.classList.add('active-target');el.scrollIntoView({behavior:'smooth',block:'center'});}else{el.classList.remove('active-target');}});searchCount.textContent=`${currentSearchIndex+1}/${searchResults.length}`;}searchInput.addEventListener('input',e=>{performSearch(e.target.value);});searchNextBtn.addEventListener('click',()=>{if(searchResults.length===0)return;currentSearchIndex=(currentSearchIndex+1)%searchResults.length;updateSearchResultFocus();});searchPrevBtn.addEventListener('click',()=>{if(searchResults.length===0)return;currentSearchIndex=(currentSearchIndex-1+searchResults.length)%searchResults.length;updateSearchResultFocus();});let currentSpeechType=null;function getAllElementsToSpeak(type){const selectors='p, div, figcaption, h1, h2, h3, h4, h5, h6, li';const elements=[];const allNodes=Array.from(bookContent.querySelectorAll(selectors));allNodes.forEach(node=>{if(node.children.length>0&&Array.from(node.children).some(child=>['P','DIV','H1','H2','H3','H4','LI'].includes(child.tagName)))return;if(type==='en'){const isViNode=node.classList.contains('sentence-vi')||node.closest('.sentence-vi')||node.tagName==='I'||node.tagName==='EM';if(!isViNode){let clone=node.cloneNode(true);clone.querySelectorAll('.sentence-vi, i, em').forEach(vi=>vi.remove());let text=cleanTextForSpeech(clone.textContent);if(text&&/[a-zA-Z]{2,}/.test(text)){elements.push({el:node,text});}}}else if(type==='vi'){const isViNode=node.classList.contains('sentence-vi')||node.tagName==='I'||node.tagName==='EM';if(isViNode){let text=cleanTextForSpeech(node.textContent);if(text&&text.length>1){elements.push({el:node,text});}}}});return elements;}function clearHighlight(){document.querySelectorAll('.reading-word-highlight').forEach(el=>el.classList.remove('reading-word-highlight'));}function findClosestStartIndex(allItems){const containerRect=readerContainer.getBoundingClientRect();const containerCenter=containerRect.top+containerRect.height/2;let closestIndex=0;let minDistance=Infinity;allItems.forEach((item,idx)=>{const rect=item.el.getBoundingClientRect();const itemCenter=rect.top+rect.height/2;const distance=Math.abs(itemCenter-containerCenter);if(distance<minDistance){minDistance=distance;closestIndex=idx;}});return closestIndex;}function speakBatch(type){if(!('speechSynthesis'in window))return;if(currentSpeechType===type&&window.speechSynthesis.speaking){window.speechSynthesis.cancel();resetSpeakButtons();return;}const allItems=getAllElementsToSpeak(type);if(allItems.length===0){alert('No '+type.toUpperCase()+' text found to read!');resetSpeakButtons();return;}const startIndex=findClosestStartIndex(allItems);startReadingFromIndex(type,allItems,startIndex);}function startReadingFromIndex(type,allItems,startIndex){window.speechSynthesis.cancel();currentSpeechType=type;if(type==='en'){speakEnBtn.classList.add('speaking');speakEnBtn.innerHTML='⏹️ Stop EN';speakViBtn.classList.remove('speaking');speakViBtn.innerHTML='🔊 Speak VI';}else{speakViBtn.classList.add('speaking');speakViBtn.innerHTML='⏹️ Stop VI';speakEnBtn.classList.remove('speaking');speakEnBtn.innerHTML='🔊 Speak EN';}let index=startIndex;function speakNext(){if(index>=allItems.length||currentSpeechType!==type){resetSpeakButtons();return;}const item=allItems[index];clearHighlight();window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(item.text);u.lang=type==='en'?'en-US':'vi-VN';const v=getBestVoice(type==='en'?'en':'vi');if(v)u.voice=v;u.rate=currentSpeechRate;let wordMap=[];let wordTokens=type==='en'?Array.from(item.el.querySelectorAll('.en-word-token')):Array.from(item.el.querySelectorAll('.vi-word-token'));let searchPos=0;wordMap=wordTokens.map(t=>{let tText=t.textContent;let idx=item.text.indexOf(tText,searchPos);if(idx===-1)idx=item.text.indexOf(tText);if(idx!==-1)searchPos=idx+tText.length;return{token:t,start:idx,end:idx+tText.length};});u.onboundary=(e)=>{if(e.name==='word'&&wordMap.length>0){clearHighlight();let matched=wordMap.find(m=>e.charIndex>=m.start-2&&e.charIndex<m.end+2);if(!matched){matched=wordMap.reduce((prev,curr)=>Math.abs(curr.start-e.charIndex)<Math.abs(prev.start-e.charIndex)?curr:prev,wordMap[0]);}if(matched&&matched.token){matched.token.classList.add('reading-word-highlight');matched.token.scrollIntoView({behavior:'smooth',block:'center'});}}};let isFinished=false;u.onend=()=>{if(isFinished)return;isFinished=true;clearHighlight();index++;setTimeout(speakNext,50);};u.onerror=(e)=>{if(isFinished)return;isFinished=true;clearHighlight();index++;setTimeout(speakNext,50);};window.speechSynthesis.speak(u);}speakNext();}function resetSpeakButtons(){currentSpeechType=null;clearHighlight();speakEnBtn.classList.remove('speaking');speakEnBtn.innerHTML='🔊 Speak EN';speakViBtn.classList.remove('speaking');speakViBtn.innerHTML='🔊 Speak VI';}speakEnBtn.addEventListener('click',()=>speakBatch('en'));speakViBtn.addEventListener('click',()=>speakBatch('vi'));</script></body></html>
