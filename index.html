<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilingual E-Reader V11</title>
    <!-- Thư viện JSZip giải nén EPUB chuẩn xác 100% -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --text-color: #2d3748;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --en-color: #1a365d;
            --vi-color: #2b6cb0;
            --highlight-bg: #feebc8;
            --accent-color: #3182ce;
            --bottom-panel-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --reader-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --reader-font-size: 17px;
        }

        [data-theme="dark"] {
            --bg-color: #121824;
            --text-color: #e2e8f0;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --en-color: #90cdf4;
            --vi-color: #63b3ed;
            --highlight-bg: #744210;
            --accent-color: #4299e1;
            --bottom-panel-bg: #1e293b;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 6px var(--shadow-color);
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
        }

        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            overflow: hidden;
            display: none;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--en-color);
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        button.control-btn, .auto-speak-btn-top, .save-pos-btn, select.control-select {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
        }

        select.control-select {
            outline: none;
        }

        .auto-speak-btn-top {
            background-color: #cbd5e0;
            color: #4a5568;
            border: none;
            transition: background 0.2s, color 0.2s;
        }

        .auto-speak-btn-top.active {
            background-color: #38a169;
            color: white;
        }

        .save-pos-btn {
            background-color: #3182ce;
            color: white;
            border: none;
        }

        .search-open-btn {
            background-color: #d69e2e;
            color: white;
            border: none;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            flex-direction: column;
        }

        .reader-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px 140px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        .book-content {
            width: 100%;
            max-width: 100%;
            line-height: 1.8;
            font-family: var(--reader-font-family);
            font-size: var(--reader-font-size);
            background-color: var(--panel-bg);
            padding: 16px 14px;
            border-radius: 10px;
            box-shadow: 0 2px 12px var(--shadow-color);
            border: 1px solid var(--border-color);
            transition: font-size 0.2s ease;
        }

        @media (min-width: 768px) {
            .reader-container {
                padding: 30px 20px 140px 20px;
            }
            .book-content {
                max-width: 850px;
                padding: 40px 50px;
                border-radius: 12px;
            }
        }

        .book-content p {
            margin-bottom: 18px;
        }

        .sentence-vi, .book-content i, .book-content em {
            color: var(--vi-color) !important;
            font-style: italic !important;
            display: block;
            margin-top: 4px;
            font-size: 0.95em;
        }

        span[title], [title] {
            cursor: pointer;
            border-radius: 3px;
            padding: 0 2px;
            transition: background 0.15s;
        }

        span[title]:hover, [title]:hover, span[title]:active, [title]:active {
            background-color: var(--highlight-bg) !important;
            text-decoration: underline;
        }

        .search-highlight {
            background-color: #ecc94b !important;
            color: #1a202c !important;
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* Modal tìm kiếm thông minh */
        .search-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 1000;
            padding-top: 50px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .search-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .search-modal-content {
            background: var(--panel-bg);
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            max-height: 80vh;
            overflow: hidden;
        }

        .search-modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .search-results-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .search-result-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .search-result-item:hover {
            background-color: var(--bg-color);
        }

        .search-result-snippet {
            font-size: 13px;
            color: var(--text-color);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .bottom-meaning-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bottom-panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -6px 20px var(--shadow-color);
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bottom-meaning-panel.active {
            transform: translateY(0);
        }

        .meaning-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding-right: 12px;
        }

        .panel-word {
            font-size: 16px;
            font-weight: 700;
            color: var(--en-color);
        }

        .panel-definition {
            font-size: 14px;
            color: var(--text-color);
        }

        .panel-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-color);
            gap: 16px;
            background-color: var(--panel-bg);
            width: 100%;
            max-width: 100%;
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 12px var(--shadow-color);
            border: 1px solid var(--border-color);
            margin: auto;
        }

        @media (min-width: 768px) {
            .welcome-screen {
                max-width: 600px;
                padding: 40px;
                border-radius: 12px;
            }
        }

        #epub-custom-styles { display: none; }
    </style>
    <style id="epub-custom-styles"></style>
</head>
<body>

    <header>
        <div class="brand-title">📖 Bilingual E-Reader V11</div>
        <div class="upload-section">
            <label for="epub-file" class="upload-btn">📂 Mở EPUB</label>
            <input type="file" id="epub-file" accept=".epub">
        </div>
        <div class="controls">
            <button class="control-btn search-open-btn" id="search-open-btn" title="Tìm kiếm thông minh">🔍 Tìm kiếm</button>
            <select id="font-family-select" class="control-select" title="Chọn font chữ">
                <option value="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif">Font: Mặc định</option>
                <option value="'Georgia', 'Times New Roman', serif">Font: Serif (Sách)</option>
                <option value="'Arial', 'Helvetica', sans-serif">Font: Sans-Serif</option>
                <option value="'Courier New', Courier, monospace">Font: Monospace</option>
            </select>
            <button class="control-btn" id="font-decrease" title="Giảm cỡ chữ">A-</button>
            <button class="control-btn" id="font-increase" title="Tăng cỡ chữ">A+</button>
            <button class="auto-speak-btn-top" id="auto-speak-toggle" title="Bật/Tắt tự động đọc từ khi click">🔊 Auto Speak: OFF</button>
            <button class="save-pos-btn" id="save-pos-btn">💾 Lưu vị trí</button>
            <button class="control-btn" id="theme-toggle">🌙 Đêm</button>
        </div>
        <!-- Thanh tiến trình -->
        <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </header>

    <div class="main-container">
        <div class="reader-container" id="reader-container">
            <div class="welcome-screen" id="welcome-screen">
                <h2>Trình Đọc Sách Song Ngữ V11</h2>
                <p>Tích hợp tính năng Tìm kiếm thông minh, giúp bạn tra cứu từ vựng và câu văn nhanh chóng trong toàn bộ cuốn sách.</p>
            </div>
            <div class="book-content" id="book-content" style="display: none;"></div>
        </div>

        <!-- Modal Tìm kiếm thông minh -->
        <div class="search-modal" id="search-modal">
            <div class="search-modal-content">
                <div class="search-modal-header">
                    <input type="text" class="search-input" id="search-input-box" placeholder="Nhập từ khóa tiếng Anh hoặc tiếng Việt để tìm...">
                    <button class="control-btn" id="search-close-btn">✕</button>
                </div>
                <div class="search-results-container" id="search-results-container">
                    <div style="text-align: center; color: #a0aec0; padding: 20px; font-size: 13px;">Nhập từ khóa để bắt đầu tìm kiếm nội dung sách...</div>
                </div>
            </div>
        </div>

        <!-- Panel hiển thị nghĩa phía dưới màn hình -->
        <div class="bottom-meaning-panel" id="meaning-panel">
            <div class="meaning-content">
                <div class="panel-word" id="panel-word-text">--</div>
                <div class="panel-definition" id="panel-def-text">Bấm vào bất kỳ từ tiếng Anh nào trong sách để xem nghĩa.</div>
            </div>
            <div class="panel-actions">
                <button class="control-btn" id="panel-speak-btn" style="background-color: var(--accent-color); color: white; border: none;">🔊 Nghe</button>
                <button class="control-btn" id="panel-close-btn" style="padding: 6px 10px;">✕</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('epub-file');
        const bookContent = document.getElementById('book-content');
        const welcomeScreen = document.getElementById('welcome-screen');
        const readerContainer = document.getElementById('reader-container');
        const themeToggle = document.getElementById('theme-toggle');
        const autoSpeakToggleBtn = document.getElementById('auto-speak-toggle');
        const savePosBtn = document.getElementById('save-pos-btn');
        const fontFamilySelect = document.getElementById('font-family-select');
        const fontDecreaseBtn = document.getElementById('font-decrease');
        const fontIncreaseBtn = document.getElementById('font-increase');
        const epubCustomStyles = document.getElementById('epub-custom-styles');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        
        const meaningPanel = document.getElementById('meaning-panel');
        const panelWordText = document.getElementById('panel-word-text');
        const panelDefText = document.getElementById('panel-def-text');
        const panelSpeakBtn = document.getElementById('panel-speak-btn');
        const panelCloseBtn = document.getElementById('panel-close-btn');

        // Elements tìm kiếm
        const searchOpenBtn = document.getElementById('search-open-btn');
        const searchModal = document.getElementById('search-modal');
        const searchCloseBtn = document.getElementById('search-close-btn');
        const searchInputBox = document.getElementById('search-input-box');
        const searchResultsContainer = document.getElementById('search-results-container');

        let currentActiveWord = "";
        let activeBookKey = "";
        
        let isAutoSpeakOn = localStorage.getItem('reader_auto_speak') === 'true';
        updateAutoSpeakButtonUI();

        let currentFontSize = parseInt(localStorage.getItem('reader_font_size')) || 17;
        let currentFontFamily = localStorage.getItem('reader_font_family') || fontFamilySelect.value;

        applyFontSettings();
        fontFamilySelect.value = currentFontFamily;

        autoSpeakToggleBtn.addEventListener('click', () => {
            isAutoSpeakOn = !isAutoSpeakOn;
            localStorage.setItem('reader_auto_speak', isAutoSpeakOn);
            updateAutoSpeakButtonUI();
        });

        function updateAutoSpeakButtonUI() {
            if (isAutoSpeakOn) {
                autoSpeakToggleBtn.textContent = '🔊 Auto Speak: ON';
                autoSpeakToggleBtn.classList.add('active');
            } else {
                autoSpeakToggleBtn.textContent = '🔇 Auto Speak: OFF';
                autoSpeakToggleBtn.classList.remove('active');
            }
        }

        fontFamilySelect.addEventListener('change', (e) => {
            currentFontFamily = e.target.value;
            localStorage.setItem('reader_font_family', currentFontFamily);
            applyFontSettings();
        });

        fontIncreaseBtn.addEventListener('click', () => {
            if (currentFontSize < 32) {
                currentFontSize += 2;
                localStorage.setItem('reader_font_size', currentFontSize);
                applyFontSettings();
            }
        });

        fontDecreaseBtn.addEventListener('click', () => {
            if (currentFontSize > 12) {
                currentFontSize -= 2;
                localStorage.setItem('reader_font_size', currentFontSize);
                applyFontSettings();
            }
        });

        function applyFontSettings() {
            document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');
            document.documentElement.style.setProperty('--reader-font-family', currentFontFamily);
        }

        themeToggle.addEventListener('click', () => {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'light') {
                html.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️ Ngày';
            } else {
                html.setAttribute('data-theme', 'light');
                themeToggle.textContent = '🌙 Đêm';
            }
        });

        panelCloseBtn.addEventListener('click', () => {
            meaningPanel.classList.remove('active');
        });

        // Xử lý Modal Tìm Kiếm
        searchOpenBtn.addEventListener('click', () => {
            if (bookContent.style.display === 'none') {
                alert('Vui lòng mở một file EPUB trước khi sử dụng tính năng tìm kiếm!');
                return;
            }
            searchModal.classList.add('active');
            searchInputBox.focus();
        });

        searchCloseBtn.addEventListener('click', () => {
            searchModal.classList.remove('active');
        });

        searchModal.addEventListener('click', (e) => {
            if (e.target === searchModal) {
                searchModal.classList.remove('active');
            }
        });

        // Thuật toán Tìm kiếm thông minh thực tế
        let searchDebounceTimer;
        searchInputBox.addEventListener('input', (e) => {
            clearTimeout(searchDebounceTimer);
            const keyword = e.target.value.trim().toLowerCase();

            if (!keyword) {
                searchResultsContainer.innerHTML = '<div style="text-align: center; color: #a0aec0; padding: 20px; font-size: 13px;">Nhập từ khóa để bắt đầu tìm kiếm nội dung sách...</div>';
                return;
            }

            searchDebounceTimer = setTimeout(() => {
                performSmartSearch(keyword);
            }, 300);
        });

        function performSmartSearch(keyword) {
            const paragraphs = bookContent.querySelectorAll('p, div.epub-chapter p, div.epub-chapter div');
            let matches = [];

            paragraphs.forEach((p, index) => {
                const text = p.textContent || "";
                if (text.toLowerCase().includes(keyword)) {
                    matches.push({ element: p, text: text });
                }
            });

            if (matches.length === 0) {
                searchResultsContainer.innerHTML = `<div style="text-align: center; color: #e53e3e; padding: 20px; font-size: 13px;">Không tìm thấy kết quả nào cho "${keyword}"</div>`;
                return;
            }

            let htmlResults = `<div style="font-size: 12px; color: var(--text-color); margin-bottom: 8px; font-weight: 600;">Tìm thấy ${matches.length} kết quả:</div>`;
            
            matches.slice(0, 50).forEach((match, idx) => { // Giới hạn hiển thị 50 kết quả đầu tiên cho mượt
                // Tạo đoạn trích có highlight từ khóa nhẹ nhàng
                let snippet = match.text;
                if (snippet.length > 120) {
                    const lowerText = snippet.toLowerCase();
                    const pos = lowerText.indexOf(keyword);
                    const start = Math.max(0, pos - 40);
                    const end = Math.min(snippet.length, pos + keyword.length + 80);
                    snippet = (start > 0 ? '...' : '') + snippet.substring(start, end) + (end < snippet.length ? '...' : '');
                }

                htmlResults += `
                    <div class="search-result-item" data-index="${idx}">
                        <div style="font-weight: 600; font-size: 12px; color: var(--accent-color);">Kết quả #${idx + 1}</div>
                        <div class="search-result-snippet">${escapeHtml(snippet)}</div>
                    </div>
                `;
            });

            searchResultsContainer.innerHTML = htmlResults;

            // Gắn sự kiện click để nhảy trực tiếp đến vị trí đoạn văn trong sách
            searchResultsContainer.querySelectorAll('.search-result-item').forEach((item, idx) => {
                item.addEventListener('click', () => {
                    const targetEl = matches[idx].element;
                    searchModal.classList.remove('active');
                    
                    // Cuộn màn hình đến đoạn văn tương ứng
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Hiệu ứng nhấp nháy highlight tạm thời
                    targetEl.classList.add('search-highlight');
                    setTimeout(() => {
                        targetEl.classList.remove('search-highlight');
                    }, 2500);
                });
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        savePosBtn.addEventListener('click', () => {
            if (bookContent.style.display === 'none') {
                alert('Chưa có sách nào đang mở để lưu vị trí!');
                return;
            }
            if (activeBookKey) {
                localStorage.setItem(`pos_${activeBookKey}`, readerContainer.scrollTop);
                const oldText = savePosBtn.textContent;
                savePosBtn.textContent = '✅ Đã lưu!';
                setTimeout(() => { savePosBtn.textContent = '💾 Lưu vị trí'; }, 1500);
            }
        });

        let scrollTimeout;
        readerContainer.addEventListener('scroll', () => {
            if (bookContent.style.display !== 'none' && activeBookKey) {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    localStorage.setItem(`pos_${activeBookKey}`, readerContainer.scrollTop);
                }, 400);
            }
        });

        function updateProgress(percent, text) {
            progressContainer.style.display = 'block';
            progressFill.style.width = percent + '%';
            bookContent.innerHTML = `<div style="text-align:center; padding: 50px 20px;"><div style="font-style:italic; margin-bottom: 12px; font-size: 16px;">⏳ ${text}</div><div style="font-weight:700; color: var(--accent-color); font-size: 18px;">${percent}%</div></div>`;
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            activeBookKey = `${file.name}_${file.size}`;

            welcomeScreen.style.display = 'none';
            bookContent.style.display = 'block';
            
            try {
                updateProgress(10, "Đang giải nén file EPUB...");
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);

                updateProgress(30, "Đang đọc cấu trúc sách...");
                const containerFile = zipContent.file("META-INF/container.xml");
                if (!containerFile) throw new Error("Không tìm thấy file container.xml trong EPUB.");
                
                const containerXmlText = await containerFile.async("text");
                const parser = new DOMParser();
                const containerDoc = parser.parseFromString(containerXmlText, "text/xml");
                const rootfileNode = containerDoc.querySelector("rootfile");
                if (!rootfileNode) throw new Error("Không tìm thấy rootfile.");
                
                const opfPath = rootfileNode.getAttribute("full-path");
                const opfFolder = opfPath.includes("/") ? opfPath.substring(0, opfPath.lastIndexOf("/") + 1) : "";

                const opfFile = zipContent.file(opfPath);
                if (!opfFile) throw new Error("Không tìm thấy file cấu trúc OPF.");
                
                const opfText = await opfFile.async("text");
                const opfDoc = parser.parseFromString(opfText, "text/xml");

                updateProgress(50, "Đang tải định nghĩa CSS...");
                let combinedCSS = "";
                const cssItems = opfDoc.querySelectorAll("item[media-type='text/css']");
                for (let item of cssItems) {
                    const href = item.getAttribute("href");
                    const cssFile = zipContent.file(opfFolder + href);
                    if (cssFile) {
                        const cssText = await cssFile.async("text");
                        combinedCSS += cssText + "\n";
                    }
                }
                epubCustomStyles.textContent = combinedCSS;

                const itemrefs = opfDoc.querySelectorAll("spine itemref");
                const manifestItems = {};
                opfDoc.querySelectorAll("manifest item").forEach(item => {
                    manifestItems[item.getAttribute("id")] = item.getAttribute("href");
                });

                updateProgress(70, "Đang ghép nối nội dung các chương...");
                let htmlFragments = [];

                for (let itemref of itemrefs) {
                    const idref = itemref.getAttribute("idref");
                    const href = manifestItems[idref];
                    if (href) {
                        const htmlFile = zipContent.file(opfFolder + href);
                        if (htmlFile) {
                            let htmlText = await htmlFile.async("text");
                            const htmlDoc = parser.parseFromString(htmlText, "text/html");
                            const bodyContent = htmlDoc.body ? htmlDoc.body.innerHTML : htmlText;
                            htmlFragments.push(`<div class="epub-chapter" style="margin-bottom: 40px;">${bodyContent}</div>`);
                        }
                    }
                }

                if (htmlFragments.length === 0) {
                    progressContainer.style.display = 'none';
                    bookContent.innerHTML = '<div style="text-align:center; padding: 40px;">Không tìm thấy nội dung văn bản trong sách này.</div>';
                    return;
                }

                updateProgress(90, "Đang định dạng giao diện song ngữ...");

                setTimeout(() => {
                    bookContent.innerHTML = htmlFragments.join('');

                    formatBilingualLayout();
                    attachTitleEvents();

                    progressContainer.style.display = 'none';

                    const savedScrollPos = localStorage.getItem(`pos_${activeBookKey}`);
                    if (savedScrollPos) {
                        setTimeout(() => {
                            readerContainer.scrollTo({
                                top: parseInt(savedScrollPos),
                                behavior: 'smooth'
                            });
                        }, 100);
                    } else {
                        readerContainer.scrollTop = 0;
                    }
                }, 50);

            } catch (error) {
                console.error(error);
                progressContainer.style.display = 'none';
                bookContent.innerHTML = `<div style="text-align:center; color: #e53e3e; padding: 40px;">Lỗi: Không thể đọc file EPUB.<br><small>${error.message}</small></div>`;
            }
        });

        function formatBilingualLayout() {
            const paragraphs = bookContent.querySelectorAll('p, div');
            paragraphs.forEach(p => {
                const text = p.textContent.trim();
                if (p.querySelector('i, em') || text.match(/[àáạảãâấầẩẫậăắằẳẵặèéẹẻẽêếềểễệìíịỉĩòóọỏõôốồổỗộơớờởỡợùúụủũưứừửữựỳýỵỷỹđ]/i)) {
                    if (!p.querySelector('span[title]')) {
                        p.classList.add('sentence-vi');
                    }
                }
            });
        }

        function attachTitleEvents() {
            const interactiveElements = bookContent.querySelectorAll('span[title], [title]');

            interactiveElements.forEach(el => {
                const wordText = el.textContent.trim();
                const titleValue = el.getAttribute('title');

                if (!wordText || !titleValue) return;

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentActiveWord = wordText;

                    panelWordText.textContent = wordText;
                    panelDefText.textContent = titleValue;
                    meaningPanel.classList.add('active');

                    if (isAutoSpeakOn) {
                        speakWord(wordText);
                    }
                });
            });
        }

        panelSpeakBtn.addEventListener('click', () => {
            if (currentActiveWord) speakWord(currentActiveWord);
        });

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
