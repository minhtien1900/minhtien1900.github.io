<!DOCTYPE html><html lang="vi" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Bilingual E-Reader V24</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script><style>:root{--bg-color: #f5f5f7;--text-color: #1d1d1f;--panel-bg: rgba(255, 255, 255, 0.9);--border-color: rgba(0, 0, 0, 0.1);--en-color: #0066cc;--vi-color: #2563eb;--highlight-bg: #fff3d6;--accent-color: #0071e3;--bottom-panel-bg: #ffffff;--shadow-color: rgba(0, 0, 0, 0.06);--reader-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;--reader-font-size: 18px;}[data-theme="dark"]{--bg-color: #000000;--text-color: #f5f5f7;--panel-bg: rgba(29, 29, 31, 0.9);--border-color: rgba(255, 255, 255, 0.15);--en-color: #2997ff;--vi-color: #60a5fa;--highlight-bg: #453511;--accent-color: #0071e3;--bottom-panel-bg: #1c1c1e;--shadow-color: rgba(0, 0, 0, 0.4);}*{box-sizing: border-box;margin: 0;padding: 0;-webkit-tap-highlight-color: transparent;}html, body{width: 100%;max-width: 100vw;overflow-x: hidden !important;position: relative;}body{font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;background-color: var(--bg-color);color: var(--text-color);display: flex;flex-direction: column;height: 100vh;overflow-y: hidden;transition: background 0.3s, color 0.3s;}header{display: flex;flex-direction: column;padding: 10px 14px;background-color: var(--panel-bg);backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);border-bottom: 1px solid var(--border-color);z-index: 1000;position: fixed;top: 0;left: 0;width: 100%;max-width: 100vw;gap: 8px;overflow-x: hidden;}.header-top-row{display: flex;justify-content: space-between;align-items: center;width: 100%;gap: 10px;}.progress-bar-container{position: absolute;bottom: 0;left: 0;width: 100%;height: 3px;background: transparent;overflow: hidden;display: none;}.progress-bar-fill{height: 100%;width: 0%;background-color: var(--accent-color);transition: width 0.3s ease;}.brand-title{font-size: 13px;font-weight: 600;letter-spacing: -0.01em;color: var(--text-color);flex: 1;white-space: nowrap;overflow: hidden;text-overflow: ellipsis;}.header-info-group{display: flex;align-items: center;gap: 8px;flex: 1;min-width: 0;}.header-version{font-size: 10px;font-weight: 600;letter-spacing: 0.05em;color: var(--accent-color);background: var(--bg-color);padding: 2px 7px;border-radius: 20px;border: 1px solid var(--border-color);text-transform: uppercase;flex-shrink: 0;}.upload-section input[type="file"]{display: none;}.upload-btn{background-color: var(--accent-color);color: white;padding: 7px 14px;border-radius: 16px;cursor: pointer;font-weight: 500;font-size: 12px;display: inline-flex;align-items: center;gap: 5px;min-height: 36px;flex-shrink: 0;}.controls{display: flex;flex-wrap: wrap;gap: 6px;align-items: center;width: 100%;justify-content: flex-start;}button.control-btn, .auto-speak-btn-top, .save-pos-btn, select.control-select{background: rgba(120, 120, 128, 0.1);border: none;color: var(--text-color);padding: 7px 12px;border-radius: 14px;cursor: pointer;font-weight: 500;font-size: 12px;display: inline-flex;align-items: center;gap: 5px;min-height: 36px;transition: all 0.2s ease;}button.control-btn:active, .auto-speak-btn-top:active, .save-pos-btn:active, select.control-select:active{transform: scale(0.96);background: rgba(120, 120, 128, 0.2);}.auto-speak-btn-top.active{background-color: #34c759;color: white;}.save-pos-btn{background-color: var(--accent-color);color: white;}.main-container{display: flex;flex: 1;overflow: hidden;position: relative;flex-direction: column;margin-top: 96px;width: 100%;max-width: 100vw;}.reader-container{flex: 1;overflow-y: auto;overflow-x: hidden !important;padding: 16px 12px 140px 12px;display: flex;flex-direction: column;align-items: stretch;-webkit-overflow-scrolling: touch;width: 100%;max-width: 100vw;}.book-content{width: 100%;max-width: 100%;line-height: 1.9;font-family: var(--reader-font-family);font-size: var(--reader-font-size);background-color: var(--panel-bg);padding: 20px 20px;border-radius: 16px;box-shadow: 0 4px 24px var(--shadow-color);border: 1px solid var(--border-color);word-break: break-word;overflow-wrap: break-word;}.book-content p{margin-bottom: 20px;}.sentence-vi,.book-content i,.book-content em{color: var(--vi-color) !important;font-style: italic !important;display: block;margin-top: 6px;font-size: 0.95em;}span[title],[title]{cursor: pointer;border-radius: 3px;padding: 0 2px;transition: background 0.15s;}span[title]:hover,[title]:hover,span[title]:active,[title]:active{background-color: var(--highlight-bg) !important;text-decoration: underline;}.bottom-meaning-panel{position: absolute;bottom: 0;left: 0;width: 100%;background-color: var(--bottom-panel-bg);backdrop-filter: blur(20px);border-top: 1px solid var(--border-color);padding: 18px 20px;display: flex;justify-content: space-between;align-items: center;box-shadow: 0 -8px 24px var(--shadow-color);z-index: 100;transform: translateY(100%);transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);}.bottom-meaning-panel.active{transform: translateY(0);}.meaning-content{display: flex;flex-direction: column;gap: 4px;flex: 1;padding-right: 12px;min-width: 0;}.panel-word{font-size: 16px;font-weight: 600;color: var(--en-color);overflow: hidden;text-overflow: ellipsis;}.panel-definition{font-size: 14px;color: var(--text-color);}.panel-actions{display: flex;gap: 8px;align-items: center;flex-shrink: 0;}.modal-overlay{position: fixed;top: 0;left: 0;width: 100vw;height: 100vh;background: rgba(0,0,0,0.4);backdrop-filter: blur(4px);z-index: 2000;display: flex;align-items: center;justify-content: center;opacity: 0;pointer-events: none;transition: opacity 0.2s;}.modal-overlay.active{opacity: 1;pointer-events: auto;}.modal-box{background: var(--bottom-panel-bg);border: 1px solid var(--border-color);width: 90%;max-width: 500px;max-height: 80vh;border-radius: 20px;padding: 20px;display: flex;flex-direction: column;box-shadow: 0 10px 30px rgba(0,0,0,0.15);}.modal-header{display: flex;justify-content: space-between;align-items: center;margin-bottom: 12px;font-weight: 600;font-size: 16px;}.modal-body{overflow-y: auto;flex: 1;display: flex;flex-direction: column;gap: 10px;padding-right: 4px;}.vocab-item{background: rgba(120,120,128,0.06);padding: 10px 12px;border-radius: 12px;display: flex;flex-direction: column;gap: 3px;}.vocab-word{font-weight: 600;color: var(--en-color);font-size: 14px;}.vocab-ipa{color: #8e8e93;font-size: 12px;font-family: monospace;}.vocab-meaning{font-size: 13px;color: var(--text-color);}.book-item{background: rgba(120,120,128,0.06);padding: 12px;border-radius: 12px;display: flex;justify-content: space-between;align-items: center;cursor: pointer;transition: background 0.2s;}.book-item:hover{background: rgba(0,113,227,0.1);}.book-item-name{font-weight: 500;font-size: 14px;overflow: hidden;text-overflow: ellipsis;white-space: nowrap;flex: 1;margin-right: 10px;}.book-item-action{font-size: 12px;color: var(--accent-color);font-weight: 600;flex-shrink: 0;}.welcome-screen{display: flex;flex-direction: column;align-items: center;justify-content: center;height: 100%;text-align: center;color: var(--text-color);gap: 16px;background-color: var(--panel-bg);width: 100%;max-width: 650px;padding: 40px;border-radius: 16px;box-shadow: 0 4px 24px var(--shadow-color);border: 1px solid var(--border-color);margin: auto;}#epub-custom-styles{display: none;}</style><style id="epub-custom-styles"></style></head><body>
<header id="main-header">
  <div class="header-top-row">
    <div class="header-info-group">
      <div class="header-version">V24</div>
      <div class="brand-title" id="brand-title-text">📁 Filename: No file selected</div>
    </div>
    <div class="upload-section">
      <label for="epub-file" class="upload-btn">📂 Open</label>
      <input type="file" id="epub-file" accept=".epub">
    </div>
  </div>
  <div class="controls">
    <select id="font-family-select" class="control-select" title="Font Family">
      <option value="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif">Aa SF Pro</option>
      <option value="'Inter', sans-serif">Aa Inter</option>
      <option value="'Georgia', serif">Aa Georgia</option>
      <option value="'Lora', serif">Aa Lora</option>
      <option value="'Roboto', sans-serif">Aa Roboto</option>
      <option value="'Fira Code', monospace">Aa Fira Code</option>
    </select>
    <button class="control-btn" id="font-decrease" title="Decrease Font">A-</button>
    <button class="control-btn" id="font-increase" title="Increase Font">A+</button>
    <button class="auto-speak-btn-top" id="auto-speak-toggle">🔇 Auto Speak: Off</button>
    <button class="control-btn" id="stats-btn">📊 Statistics</button>
    <button class="control-btn" id="list-books-btn">📚 List Books</button>
    <button class="save-pos-btn" id="save-pos-btn">💾 Save</button>
    <button class="control-btn" id="theme-toggle">🌙 Theme</button>
  </div>
  <div class="progress-bar-container" id="progress-container">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>
</header>

<main class="main-container">
  <div class="reader-container" id="reader-container">
    <div class="welcome-screen" id="welcome-screen">
      <h2>Bilingual E-Reader V24</h2>
      <p>Remembers button selections and configuration states.</p>
    </div>
    <div class="book-content" id="book-content" style="display: none;"></div>
  </div>

  <div class="bottom-meaning-panel" id="meaning-panel">
    <div class="meaning-content">
      <div class="panel-word" id="panel-word-text">--</div>
      <div class="panel-definition" id="panel-def-text">Tap an English word to view definition.</div>
    </div>
    <div class="panel-actions">
      <button class="control-btn" id="panel-speak-btn" style="background-color: var(--accent-color); color: white; min-height: 40px;">🔊 Listen</button>
      <button class="control-btn" id="panel-close-btn" style="padding: 8px 12px; min-height: 40px;">✕</button>
    </div>
  </div>
</main>

<!-- STATS MODAL -->
<div class="modal-overlay" id="stats-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>📊 Vocabulary Statistics</span>
      <button class="control-btn" id="close-stats-modal" style="padding: 4px 10px;">✕</button>
    </div>
    <div class="modal-body" id="stats-modal-body"></div>
    <div style="margin-top: 12px; display: flex; justify-content: flex-end;">
      <button class="control-btn" id="clear-stats-btn" style="background-color: #ff3b30; color: white;">Clear History</button>
    </div>
  </div>
</div>

<!-- LIST BOOKS MODAL -->
<div class="modal-overlay" id="books-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>📚 List of Opened Books</span>
      <button class="control-btn" id="close-books-modal" style="padding: 4px 10px;">✕</button>
    </div>
    <div class="modal-body" id="books-modal-body"></div>
  </div>
</div>

<script>
const fileInput=document.getElementById('epub-file'),bookContent=document.getElementById('book-content'),welcomeScreen=document.getElementById('welcome-screen'),readerContainer=document.getElementById('reader-container'),mainHeader=document.getElementById('main-header'),brandTitleText=document.getElementById('brand-title-text'),themeToggle=document.getElementById('theme-toggle'),autoSpeakToggleBtn=document.getElementById('auto-speak-toggle'),savePosBtn=document.getElementById('save-pos-btn'),fontFamilySelect=document.getElementById('font-family-select'),fontDecreaseBtn=document.getElementById('font-decrease'),fontIncreaseBtn=document.getElementById('font-increase'),epubCustomStyles=document.getElementById('epub-custom-styles'),progressContainer=document.getElementById('progress-container'),progressFill=document.getElementById('progress-fill'),meaningPanel=document.getElementById('meaning-panel'),panelWordText=document.getElementById('panel-word-text'),panelDefText=document.getElementById('panel-def-text'),panelSpeakBtn=document.getElementById('panel-speak-btn'),panelCloseBtn=document.getElementById('panel-close-btn');

const statsBtn=document.getElementById('stats-btn'),statsModal=document.getElementById('stats-modal'),closeStatsModal=document.getElementById('close-stats-modal'),statsModalBody=document.getElementById('stats-modal-body'),clearStatsBtn=document.getElementById('clear-stats-btn');
const listBooksBtn=document.getElementById('list-books-btn'),booksModal=document.getElementById('books-modal'),closeBooksModal=document.getElementById('close-books-modal'),booksModalBody=document.getElementById('books-modal-body');

let currentActiveWord="",activeBookKey="";

// 1. Khôi phục trạng thái nút Auto Speak
let isAutoSpeakOn = localStorage.getItem('reader_auto_speak') === 'true';
updateAutoSpeakButtonUI();

// 2. Khôi phục trạng thái Theme (Light/Dark)
let currentTheme = localStorage.getItem('reader_theme') || 'light';
if (currentTheme === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  themeToggle.innerHTML = '☀️ Light';
} else {
  document.documentElement.setAttribute('data-theme', 'light');
  themeToggle.innerHTML = '🌙 Theme';
}

// 3. Khôi phục trạng thái Font chữ & Cỡ chữ
let currentFontSize = parseInt(localStorage.getItem('reader_font_size')) || 18;
let currentFontFamily = localStorage.getItem('reader_font_family') || fontFamilySelect.options[0].value;
fontFamilySelect.value = currentFontFamily;
applyFontSettings();

const DB_NAME="BilingualReaderDB",STORE_NAME="epub_store",DB_VERSION=1;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME);};});}

async function saveFileToIndexedDB(file,key){try{const db=await openDB(),buf=await file.arrayBuffer(),tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).put({name:file.name,size:file.size,data:buf},key);}catch(err){console.error(err);}}
async function loadFileFromIndexedDB(key){try{const db=await openDB();return new Promise((res,rej)=>{const req=db.transaction(STORE_NAME,"readonly").objectStore(STORE_NAME).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}catch(err){return null;}}

function getBookHistory(){try{return JSON.parse(localStorage.getItem('reader_book_history')||'[]');}catch(e){return [];}}
function addBookToHistory(name, size){const key=`book_${name}_${size}`;let history=getBookHistory();history=history.filter(b=>b.key!==key);history.unshift({key, name, size});localStorage.setItem('reader_book_history',JSON.stringify(history));return key;}

// Sự kiện bấm Auto Speak
autoSpeakToggleBtn.addEventListener('click',()=>{
  isAutoSpeakOn = !isAutoSpeakOn;
  localStorage.setItem('reader_auto_speak', isAutoSpeakOn);
  updateAutoSpeakButtonUI();
});
function updateAutoSpeakButtonUI(){
  if(isAutoSpeakOn){
    autoSpeakToggleBtn.innerHTML='🔊 Auto Speak: On';
    autoSpeakToggleBtn.classList.add('active');
  }else{
    autoSpeakToggleBtn.innerHTML='🔇 Auto Speak: Off';
    autoSpeakToggleBtn.classList.remove('active');
  }
}

// Sự kiện thay đổi Font Family
fontFamilySelect.addEventListener('change',e=>{
  currentFontFamily = e.target.value;
  localStorage.setItem('reader_font_family', currentFontFamily);
  applyFontSettings();
});

// Sự kiện tăng giảm cỡ chữ
fontIncreaseBtn.addEventListener('click',()=>{
  if(currentFontSize < 32){
    currentFontSize += 2;
    localStorage.setItem('reader_font_size', currentFontSize);
    applyFontSettings();
  }
});
fontDecreaseBtn.addEventListener('click',()=>{
  if(currentFontSize > 12){
    currentFontSize -= 2;
    localStorage.setItem('reader_font_size', currentFontSize);
    applyFontSettings();
  }
});

function applyFontSettings(){
  document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');
  document.documentElement.style.setProperty('--reader-font-family', currentFontFamily);
}

// Sự kiện chuyển đổi Theme (Light/Dark) và lưu lại
themeToggle.addEventListener('click',()=>{
  const html = document.documentElement;
  if(html.getAttribute('data-theme') === 'light'){
    html.setAttribute('data-theme', 'dark');
    themeToggle.innerHTML = '☀️ Light';
    localStorage.setItem('reader_theme', 'dark');
  }else{
    html.setAttribute('data-theme', 'light');
    themeToggle.innerHTML = '🌙 Theme';
    localStorage.setItem('reader_theme', 'light');
  }
});

panelCloseBtn.addEventListener('click',()=>{meaningPanel.classList.remove('active');});

savePosBtn.addEventListener('click',()=>{if(bookContent.style.display==='none'){alert('No book opened yet!');return;}if(activeBookKey){localStorage.setItem(`pos_${activeBookKey}`,readerContainer.scrollTop);savePosBtn.innerHTML='✅ Saved';setTimeout(()=>{savePosBtn.innerHTML='💾 Save';},1500);}});
readerContainer.addEventListener('scroll',()=>{if(bookContent.style.display!=='none'&&activeBookKey){clearTimeout(window.scrollTimeout);window.scrollTimeout=setTimeout(()=>{localStorage.setItem(`pos_${activeBookKey}`,readerContainer.scrollTop);},400);}});

// Statistics Modal Logic
statsBtn.addEventListener('click',()=>{renderStatsModal();statsModal.classList.add('active');});
closeStatsModal.addEventListener('click',()=>{statsModal.classList.remove('active');});
clearStatsBtn.addEventListener('click',()=>{if(confirm('Clear all learned vocabulary history?')){localStorage.removeItem('reader_vocab_history');renderStatsModal();}});

function recordVocab(word, def){try{let history=JSON.parse(localStorage.getItem('reader_vocab_history')||'[]');let ipa="N/A", meaning=def;const match=def.match(/^(\/[^\/]+\/|\[[^\]]+\])/);if(match){ipa=match[1];meaning=def.replace(match[1],'').trim();}history=history.filter(item=>item.word.toLowerCase()!==word.toLowerCase());history.unshift({word, ipa, meaning, time: new Date().toLocaleDateString()});localStorage.setItem('reader_vocab_history',JSON.stringify(history));}catch(e){}}

function renderStatsModal(){let history=[];try{history=JSON.parse(localStorage.getItem('reader_vocab_history')||'[]');}catch(e){}if(history.length===0){statsModalBody.innerHTML='<div style="text-align:center; color: #8e8e93; padding: 20px;">No words clicked yet.</div>';return;}let html='';history.forEach(item=>{html+=`<div class="vocab-item"><div class="vocab-word">${item.word}</div><div class="vocab-ipa">IPA: ${item.ipa}</div><div class="vocab-meaning">${item.meaning}</div></div>`;});statsModalBody.innerHTML=html;}

// List Books Modal Logic
listBooksBtn.addEventListener('click',()=>{renderBooksModal();booksModal.classList.add('active');});
closeBooksModal.addEventListener('click',()=>{booksModal.classList.remove('active');});

function renderBooksModal(){
  const history=getBookHistory();
  booksModalBody.innerHTML='';
  if(history.length===0){
    booksModalBody.innerHTML='<div style="text-align:center; color: #8e8e93; padding: 20px;">No book history found.</div>';
    return;
  }
  history.forEach(b=>{
    const itemEl = document.createElement('div');
    itemEl.className = 'book-item';
    itemEl.innerHTML = `<div class="book-item-name">📖 ${b.name}</div><div class="book-item-action">Open →</div>`;
    itemEl.addEventListener('click', async () => {
      booksModal.classList.remove('active');
      const savedData = await loadFileFromIndexedDB(b.key);
      if(savedData && savedData.data){
        processEpubData(savedData.data, b.name, b.size, b.key);
      } else {
        alert('Book file data not found in storage!');
      }
    });
    booksModalBody.appendChild(itemEl);
  });
}

function updateProgress(p,t){progressContainer.style.display='block';progressFill.style.width=p+'%';bookContent.innerHTML=`<div style="text-align:center; padding: 50px 20px;"><div style="font-style:italic; margin-bottom: 12px; font-size: 16px;">⏳ ${t}</div><div style="font-weight:600; color: var(--accent-color); font-size: 18px;">${p}%</div></div>`;}

async function processEpubData(buf,name,size, customKey=null){
  activeBookKey = customKey || addBookToHistory(name, size);
  welcomeScreen.style.display='none';
  bookContent.style.display='block';
  try{
    updateProgress(10,"Unzipping EPUB file...");
    const zip=new JSZip(),zipContent=await zip.loadAsync(buf);
    updateProgress(30,"Reading book structure...");
    const containerFile=zipContent.file("META-INF/container.xml");
    if(!containerFile)throw new Error("Missing container.xml");
    const containerDoc=new DOMParser().parseFromString(await containerFile.async("text"),"text/xml");
    const rootfileNode=containerDoc.querySelector("rootfile");
    if(!rootfileNode)throw new Error("Missing rootfile");
    const opfPath=rootfileNode.getAttribute("full-path"),opfFolder=opfPath.includes("/")?opfPath.substring(0,opfPath.lastIndexOf("/")+1):"";
    const opfFile=zipContent.file(opfPath);
    if(!opfFile)throw new Error("Missing OPF");
    const opfDoc=new DOMParser().parseFromString(await opfFile.async("text"),"text/xml");
    updateProgress(50,"Loading CSS definitions...");
    let combinedCSS="";
    opfDoc.querySelectorAll("item[media-type='text/css']").forEach(item=>{
      const cssFile=zipContent.file(opfFolder+item.getAttribute("href"));
      if(cssFile)cssFile.async("text").then(t=>combinedCSS+=t+"\n");
    });
    epubCustomStyles.textContent=combinedCSS;
    const itemrefs=opfDoc.querySelectorAll("spine itemref"),manifestItems={};
    opfDoc.querySelectorAll("manifest item").forEach(item=>{
      manifestItems[item.getAttribute("id")]=item.getAttribute("href");
    });
    updateProgress(70,"Merging chapter contents...");
    let htmlFragments=[];
    for(let itemref of itemrefs){
      const href=manifestItems[itemref.getAttribute("idref")];
      if(href){
        const htmlFile=zipContent.file(opfFolder+href);
        if(htmlFile){
          const htmlText=await htmlFile.async("text");
          const bodyContent=new DOMParser().parseFromString(htmlText,"text/html").body?.innerHTML||htmlText;
          htmlFragments.push(`<div class="epub-chapter" style="margin-bottom: 40px; word-break: break-word; overflow-wrap: break-word;">${bodyContent}</div>`);
        }
      }
    }
    if(htmlFragments.length===0){
      progressContainer.style.display='none';
      bookContent.innerHTML='<div style="text-align:center; padding: 40px;">Content not found.</div>';
      return;
    }
    updateProgress(90,"Formatting bilingual layout...");
    setTimeout(()=>{
      bookContent.innerHTML=htmlFragments.join('');
      formatBilingualLayout();
      attachTitleEvents();
      brandTitleText.textContent=`📁 Filename: ${name}`;
      progressContainer.style.display='none';
      const savedScrollPos=localStorage.getItem(`pos_${activeBookKey}`);
      if(savedScrollPos){
        setTimeout(()=>{readerContainer.scrollTo({top:parseInt(savedScrollPos),behavior:'smooth'});},100);
      }else{
        readerContainer.scrollTop=0;
      }
    },50);
  }catch(err){
    progressContainer.style.display='none';
    welcomeScreen.style.display='flex';
    bookContent.style.display='none';
    alert(`Error: ${err.message}`);
  }
}

fileInput.addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const key=addBookToHistory(file.name, file.size);
  await saveFileToIndexedDB(file, key);
  processEpubData(await file.arrayBuffer(),file.name,file.size, key);
});

window.addEventListener('DOMContentLoaded',async()=>{
  try{
    const history=getBookHistory();
    if(history.length>0){
      const lastBook=history[0];
      const savedData=await loadFileFromIndexedDB(lastBook.key);
      if(savedData&&savedData.data){
        processEpubData(savedData.data, lastBook.name, lastBook.size, lastBook.key);
      }
    }
  }catch(err){}
});

function formatBilingualLayout(){
  bookContent.querySelectorAll('p, div').forEach(p=>{
    const text=p.textContent.trim();
    if(p.querySelector('i, em')||text.match(/[àáạảãâấầẩẫậăắằẳẵặèéẹẻẽêếềểễệìíịỉĩòóọỏõôốồổỗộơớờởỡợùúụủũưứừửữựỳýỵỷỹđ]/i)){
      if(!p.querySelector('span[title]'))p.classList.add('sentence-vi');
    }
  });
}

function attachTitleEvents(){
  bookContent.querySelectorAll('span[title], [title]').forEach(el=>{
    const wordText=el.textContent.trim(),titleValue=el.getAttribute('title');
    if(!wordText||!titleValue)return;
    el.addEventListener('click',e=>{
      e.stopPropagation();
      currentActiveWord=wordText;
      panelWordText.textContent=wordText;
      panelDefText.textContent=titleValue;
      meaningPanel.classList.add('active');
      recordVocab(wordText, titleValue);
      if(isAutoSpeakOn)speakWord(wordText);
    });
  });
}

panelSpeakBtn.addEventListener('click',()=>{if(currentActiveWord)speakWord(currentActiveWord);});
function speakWord(word){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';
    u.rate=0.9;
    window.speechSynthesis.speak(u);
  }
}
</script>
